<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Primary Plus — Provider App</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0C2E5E" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Primary Plus" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<style>
  :root{
    --navy:#0C2E5E;--navy-2:#123A6B;--primary:#1583C5;--primary-d:#1069a3;--link:#2563EB;
    --urgent:#E8890C;--urgent-bg:#FDF1DF;--danger:#DC2626;--danger-bg:#FDECEC;
    --green:#16A34A;--green-bg:#E6F6EC;--blue-bg:#E7F1FB;--bg:#F4F6F9;--card:#fff;
    --line:#E5E8EE;--text:#1B2430;--muted:#697386;--muted-2:#9AA3AF;--radius:14px;
    --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
    --font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font);background:#2b3038;color:var(--text);display:flex;
       align-items:center;justify-content:center;overflow:hidden}
  .stage{display:flex;flex-direction:column;align-items:center;gap:14px}
  .device{width:392px;height:812px;max-height:calc(100vh - 78px);background:#000;border-radius:44px;padding:11px;
     box-shadow:0 30px 70px rgba(0,0,0,.5);position:relative}
  .screen{width:100%;height:100%;background:var(--bg);border-radius:34px;overflow:hidden;
     position:relative;display:flex;flex-direction:column}
  #app{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:150px;height:26px;
     background:#000;border-radius:0 0 16px 16px;z-index:60}
  .hint{color:#8b93a1;font-size:12.5px}
  .hint b{color:#c7cdd6}
  @media (max-width:440px){
    body{display:block}.hint{display:none}
    .device{width:100vw;height:100vh;border-radius:0;padding:0}
    .screen{border-radius:0}.notch{display:none}
  }

  /* status bar */
  .sb{height:44px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;
     padding:0 22px 6px;font-size:13px;font-weight:600;position:relative;z-index:5}
  .sb .r{display:flex;align-items:center;gap:5px}
  .sb.dark{color:#fff}

  .appbar{background:#fff;padding:9px 12px 11px;display:flex;align-items:center;gap:11px;
     border-bottom:1px solid var(--line);flex:0 0 auto}
  .appbar.navy{background:var(--navy);border-bottom:none}
  .appbar.navy *{color:#fff!important}
  .appbar .ic{color:var(--text);display:flex;padding:3px;cursor:pointer}
  .appbar .title{font-size:16px;font-weight:700;flex:1;line-height:1.1}
  .appbar .sub{font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
  .appbar .acts{display:flex;gap:8px;align-items:center;color:var(--muted)}
  .appbar .acts .ic{color:var(--muted)}
  /* POV switch: simple avatar toggle chips */
  .povswitch{display:flex;align-items:center;gap:4px}
  .pov{position:relative;width:29px;height:29px;flex:0 0 auto;border-radius:50%;background:#DDE3EC;color:#5A6B85;
     display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;cursor:pointer;border:2px solid transparent}
  .pov.on{background:var(--primary);color:#fff;border-color:#fff;box-shadow:0 0 0 1.5px var(--primary)}
  .pov .pvb{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;font-size:8.5px;font-weight:700;
     min-width:15px;height:15px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 3px;border:1.5px solid #fff;font-style:normal}
  .povbar{display:flex;align-items:center;gap:8px;background:var(--blue-bg);border:1px solid #BBD6F2;border-radius:12px;
     padding:8px 11px;margin-bottom:11px;font-size:11.5px;color:var(--primary-d);font-weight:600}
  /* floating action button (FAB) — bottom-right, above the global footer */
  .fab{position:absolute;right:15px;bottom:74px;z-index:26;background:var(--primary);color:#fff;border-radius:26px;height:46px;
     display:flex;align-items:center;gap:7px;padding:0 17px;box-shadow:0 6px 18px rgba(16,24,40,.3);font-weight:700;font-size:12.5px;cursor:pointer}
  .fab:active{filter:brightness(.95)}
  .fab svg{width:20px;height:20px}
  /* in-patient context menu — internal bar that sits ABOVE the unchanged global footer */
  .pctx{flex:0 0 auto;background:#F4F7FB;border-top:1px solid var(--line);display:flex;padding:5px 4px}
  .pctx .n{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:3px 0}
  .pctx .n.on{color:var(--primary)}
  .pctx .n svg{width:18px;height:18px}
  .pctx .n:active{opacity:.6}
  /* logged-in ("you") avatar marker in the POV switch */
  .pov.self{box-shadow:0 0 0 2px var(--navy)}
  .pov.self.on{box-shadow:0 0 0 2px var(--primary)}
  .pov .selfdot{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;font-size:7px;font-weight:800;padding:0 3px;border-radius:6px;border:1.5px solid #fff;line-height:1.5;font-style:normal}
  /* message list status icons */
  .upill{background:#E8492E;color:#fff;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:10px;display:inline-flex;align-items:center;gap:3px;line-height:1}
  .upill svg{width:11px;height:11px}
  .staric{color:#F5B301;display:flex}.staric svg{width:16px;height:16px}
  .resic{color:var(--primary);display:flex;cursor:pointer}.resic svg{width:17px;height:17px}
  .unreadb{background:var(--primary);color:#fff;font-size:10px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;flex:0 0 auto}
  /* visit-note textarea with dictation mic */
  .tawrap{position:relative}
  .tawrap textarea{padding-right:38px}
  .taMic{position:absolute;right:9px;bottom:9px;color:var(--primary);cursor:pointer;display:flex}
  .taMic svg{width:18px;height:18px}
  /* thread conversation (EHR-style message list) */
  .tmsg{padding:12px 2px;border-bottom:1px solid var(--line)}
  .tmsg:last-child{border-bottom:none}
  .rolebadge{font-size:9.5px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:11px;padding:1px 8px;background:#fff;white-space:nowrap}
  .youtag{font-size:11.5px;color:var(--muted-2)}
  .tdivider{display:flex;align-items:center;justify-content:center;margin:12px 0}
  .tdivider span{background:var(--blue-bg);color:var(--primary);font-size:11px;font-weight:700;padding:4px 13px;border-radius:12px}
  .schedbar{display:flex;align-items:center;gap:8px;background:#F1F5F9;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11px;color:var(--muted);margin-bottom:9px}
  .schedbar svg{width:15px;height:15px;flex:0 0 auto;color:var(--primary)}
  .tcomposer{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:9px 11px}
  .tcbox{border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .tcbox input{border:none;outline:none;width:100%;font-family:inherit;font-size:13px;padding:4px 0;background:transparent}
  .tctool{display:flex;align-items:center;gap:16px;margin-top:8px;color:var(--muted)}
  .tctool svg{width:18px;height:18px}
  .tctool .colora{border:1px solid var(--line);border-radius:5px;padding:0 6px;font-weight:800;text-decoration:underline;color:var(--text);cursor:pointer}
  .tsend{width:34px;height:34px;border-radius:8px;background:#EDEFF2;color:#9AA3AF;display:flex;align-items:center;justify-content:center;cursor:pointer}
  /* New Thread rich-text message box */
  .msgbox{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .urgbar{background:#E9F1F8;padding:10px 11px;display:flex;align-items:center;gap:9px;font-size:13px;border-bottom:1px solid var(--line)}
  .rttool{display:flex;align-items:center;gap:15px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:15px}
  .rttool span{cursor:pointer;display:flex}.rttool b,.rttool i{cursor:pointer;font-size:15px}
  .rttool svg{width:17px;height:17px}
  .msgbox textarea{width:100%;border:none;outline:none;padding:11px 12px;font-family:inherit;font-size:13px;min-height:74px;resize:none;line-height:1.5}
  .rtfoot{display:flex;align-items:center;gap:17px;padding:8px 12px;color:var(--muted);border-top:1px solid var(--line)}
  .rtfoot svg{width:18px;height:18px}
  .rtfoot .colora{border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-weight:800;text-decoration:underline;color:var(--text);background:var(--blue-bg)}
  /* biometric unlock */
  .biocircle{width:96px;height:96px;border-radius:50%;background:var(--blue-bg);color:var(--primary);display:flex;
     align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 0 rgba(21,131,197,.4);animation:biopulse 1.8s infinite}
  .biocircle svg{width:44px;height:44px}
  @keyframes biopulse{0%{box-shadow:0 0 0 0 rgba(21,131,197,.35)}70%{box-shadow:0 0 0 16px rgba(21,131,197,0)}100%{box-shadow:0 0 0 0 rgba(21,131,197,0)}}
  /* chat attachment tray */
  .attachtray{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .att{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:10px;cursor:pointer}
  .att:active{background:#f3f5f8}.att svg{color:var(--primary);flex:0 0 auto}
  .att i{font-style:normal}
  /* swipeable Scriptsure reference (allergies / intolerance / meds) */
  .rxref{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -13px 4px;padding:0 13px 4px}
  .rxref::-webkit-scrollbar{height:0}
  .rxrefcard{flex:0 0 88%;scroll-snap-align:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
  .rxdots{display:flex;gap:5px;justify-content:center;margin-bottom:12px}
  .rxdots i{width:6px;height:6px;border-radius:50%;background:#CBD2DC}
  /* Scriptsure e-Prescribe iframe recreation */
  .ssframe{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;overflow:hidden;border-top:1px solid var(--line)}
  .ssh{background:#33b5d8;color:#fff;padding:10px 13px;display:flex;align-items:flex-start;gap:10px}
  .ssh .t{flex:1;font-size:12.5px;font-weight:700;line-height:1.4}
  .ssh .m{font-size:19px;line-height:1;opacity:.95;cursor:pointer;font-weight:700}
  .sstb{display:flex;align-items:center;gap:16px;padding:7px 14px;border-bottom:1px solid var(--line);color:#33b5d8}
  .sstb .ti{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:8px;font-weight:800;flex:0 0 auto;cursor:pointer;letter-spacing:.3px}
  .sstb .sp{flex:1}
  .ssb{flex:1;min-height:0;overflow-y:auto;padding:13px 15px}
  .ssb::-webkit-scrollbar{width:0}
  .ssdrug{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;color:#1b2430}
  .ssdrug .cv,.ssdrug .dl{color:#33b5d8;cursor:pointer;display:flex;flex:0 0 auto}
  .ssaka{font-size:12px;color:var(--muted);line-height:1.45;margin-top:5px}
  .ssnc{font-size:11px;font-weight:800;color:#33b5d8;letter-spacing:.5px;margin:13px 0}
  .sscheck{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:600;color:#1b2430;margin-bottom:15px}
  .sscheck .b{width:22px;height:22px;border-radius:5px;background:#33b5d8;color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .ssfield{margin-bottom:13px}
  .ssfield label{display:block;font-size:13px;color:#6b7280;margin-bottom:6px}
  .ssinp{border:1px solid #d5dae2;border-radius:7px;padding:11px 12px;font-size:14px;color:#1b2430;display:flex;align-items:center;justify-content:space-between}
  .ssinp span{color:#33b5d8;display:flex}
  .ssqbar{background:#33b5d8;color:#fff;border-radius:8px;padding:9px 11px;display:flex;align-items:center;gap:10px;margin:4px 0 14px}
  .ssqbar .tg{width:38px;height:20px;border-radius:11px;background:rgba(255,255,255,.35);position:relative;flex:0 0 auto}
  .ssqbar .tg:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff}
  .ssqbar .lbl{font-size:11px;font-weight:800;line-height:1.2}
  .ssqbar .sv{margin-left:auto;opacity:.95;cursor:pointer;display:flex}
  .ssmulti{background:#8b5cf6;color:#fff;font-size:9px;font-weight:800;padding:8px 9px;border-radius:6px;letter-spacing:.3px;cursor:pointer;text-align:center;line-height:1.1}
  .ssact{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:9px 11px;border-top:1px solid var(--line);background:#fff}
  .ssbtn{border:none;border-radius:6px;padding:11px 9px;font-size:11px;font-weight:800;color:#fff;letter-spacing:.2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
  .ssbtn.red{background:#e8492e;flex:1 1 auto}
  .ssbtn.cancel{background:#fff;color:#33b5d8;border:1.5px solid #33b5d8;flex:0 0 auto}
  .ssact .ic2{color:#33b5d8;cursor:pointer;display:flex;flex:0 0 auto}

  .body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:11px 11px 16px}
  .body::-webkit-scrollbar{width:0}
  .pad0{padding:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
     box-shadow:var(--shadow);padding:11px;margin-bottom:9px}
  .tap{cursor:pointer;transition:transform .06s,background .15s}
  .tap:active{transform:scale(.985);background:#fafbfc}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between}
  .grow{flex:1}.muted{color:var(--muted)}
  .xs{font-size:11px}.sm{font-size:12px}.md{font-size:13px}.lg{font-size:15px}
  .b{font-weight:700}.sb-w{font-weight:600}
  .mt4{margin-top:4px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}
  .sechead{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;
     letter-spacing:.5px;margin:4px 2px 6px}
  .hr{height:1px;background:var(--line);margin:8px 0}
  /* collapsible section (visit note) — header + body share one white panel */
  .secpanel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
  .sechd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;padding:9px 10px}
  .sechd.open{border-bottom:1px solid var(--line)}
  .sechd-left{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;min-width:0;flex:1}
  .sechd .sechd-t{font-size:13.5px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sechd .sechd-chev{color:var(--muted);display:flex;flex:0 0 auto;transition:transform .18s ease}
  .sechd-left:active .sechd-t{color:var(--primary)}
  .sechd-acts{display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .secbd{padding:10px 11px;animation:fade .16s ease}
  /* reusable dropdown option list, opened in the app's existing bottom sheet */
  .optrow{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;font-size:15.5px;font-weight:600;color:var(--text);border-bottom:1px solid var(--line);cursor:pointer}
  .optrow:last-child{border-bottom:none}
  .optrow:active{background:#f7f9fb}
  .secbd .card{background:transparent;border:none;box-shadow:none;padding:0;margin-bottom:0}
  .secbd .card .listitem{padding-left:0;padding-right:0}
  .field label:empty{display:none;margin:0}
  /* removable chip + pill action button (Allergies / Drug Intolerances / Medications / History) */
  .chiprow{display:flex;flex-wrap:wrap;gap:6px}
  .chip2{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 8px 6px 12px;font-size:12.5px;font-weight:600;color:var(--text)}
  .chip2 .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);flex:0 0 auto}
  .chip2 .sev{font-size:10px;font-weight:800;padding:2px 7px;border-radius:9px;margin-left:1px;white-space:nowrap}
  .chip2 .sev.severe{background:var(--danger-bg);color:var(--danger)}
  .chip2 .sev.moderate{background:var(--urgent-bg);color:var(--urgent)}
  .chip2 .sev.mild{background:var(--blue-bg);color:var(--primary)}
  .chip2 .x{color:var(--muted-2);cursor:pointer;display:flex;flex:0 0 auto;padding:2px}
  .chip2 .x svg{width:11px;height:11px}
  .pillbtn{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;border:1.5px solid var(--line);color:var(--muted);background:#fff;flex:0 0 auto}
  .pillbtn.primary{border-color:var(--primary);color:var(--primary)}
  .pillbtn svg{width:12px;height:12px}
  .pillbtn:active{filter:brightness(.97)}

  /* clinical panel — the chart summary that sits beside the note.
     Each section carries a semantic accent (--cp / --cpbg) so allergies and intolerances
     read as safety-critical at a glance instead of blending into the history sections. */
  .cpgrp{display:flex;align-items:center;gap:8px;margin:2px 1px 9px;
     font-size:9.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted-2)}
  .cpgrp:after{content:"";flex:1;height:1px;background:var(--line)}
  .cpgrp.mt{margin-top:15px}
  .cpsec{border:1px solid var(--line);border-left:3px solid var(--cp);border-radius:11px;
     background:#fff;margin-bottom:8px;overflow:hidden}
  .cphd{display:flex;align-items:center;gap:9px;padding:9px 10px}
  .cphd .cpic{width:25px;height:25px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;
     justify-content:center;background:var(--cpbg);color:var(--cp)}
  .cphd .cpic svg{width:14px;height:14px}
  .cphd .cpt{flex:1;min-width:0;font-size:12.5px;font-weight:700;color:var(--text);
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cphd .cpn{flex:0 0 auto;min-width:20px;height:19px;padding:0 6px;border-radius:10px;
     display:inline-flex;align-items:center;justify-content:center;
     font-size:10.5px;font-weight:800;line-height:1;background:var(--cpbg);color:var(--cp)}
  /* icon-only action button — every section action (Import / Clear / Add) uses this */
  .ibtn,.cpadd{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#fff;cursor:pointer;
     border:1.5px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
  .ibtn svg,.cpadd svg{width:13px;height:13px}
  .ibtn.primary{border-color:var(--primary);color:var(--primary)}
  .ibtn:active,.cpadd:active{border-color:var(--primary);color:var(--primary);background:var(--blue-bg)}
  .ibtn.danger:active{border-color:var(--danger);color:var(--danger);background:var(--danger-bg)}
  .cpbd{padding:0 10px 10px;display:flex;flex-wrap:wrap;gap:6px}
  .cpbd.rows{display:block;padding:0 10px 2px}
  .cprow{display:flex;align-items:center;flex-wrap:wrap;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
  .cprow .n{font-size:12.5px;font-weight:600;color:var(--text);flex:1 1 auto;min-width:0}
  .cprow .d{font-size:11px;color:var(--muted);flex:0 1 auto;margin-left:auto}
  .cpempty{padding:0 10px 11px;font-size:11.5px;color:var(--muted-2)}
  .secbd .cpbd.rows .cprow:first-child{border-top:none}
  /* free-text field inside the add sheet */
  .tinp{width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;
     font-family:inherit;font-size:14px;color:var(--text);outline:none;-webkit-appearance:none}
  .tinp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(21,131,197,.12)}
  .tinp::placeholder{color:var(--muted-2)}
  /* outlined "+ X" action chip used across Assessment & Plan */
  .addchip{display:inline-flex;align-items:center;border:1px solid var(--primary);color:var(--primary);
     background:#fff;border-radius:20px;padding:6px 11px;font-size:11.5px;font-weight:700;
     white-space:nowrap;cursor:pointer;line-height:1.15}
  .addchip:active{background:var(--blue-bg)}
  .cplabel{font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
     color:var(--muted-2);margin:11px 2px 6px}
  /* read-only chip: tinted body, white severity pill so the grade stays legible on the tint */
  .chip2.ro{padding-right:12px;background:var(--cpbg);border-color:transparent}

  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-flex;
     align-items:center;gap:4px;line-height:1;white-space:nowrap}
  .b-urgent{background:var(--urgent-bg);color:var(--urgent)}
  .b-danger{background:var(--danger-bg);color:var(--danger)}
  .b-blue{background:var(--blue-bg);color:var(--primary)}
  .b-green{background:var(--green-bg);color:var(--green)}
  .b-gray{background:#EEF0F3;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}

  .avatar{width:38px;height:38px;border-radius:50%;flex:0 0 auto;background:#DDE3EC;
     display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#5A6B85}
  .avatar.sm{width:30px;height:30px;font-size:11px}
  .avatar.lg{width:62px;height:62px;font-size:21px}

  .btn{border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;width:100%;
     cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  .btn:active{filter:brightness(.95)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-green{background:var(--green);color:#fff}
  .btn-line{background:#fff;border:1px solid var(--line);color:var(--text);font-weight:600}
  .btn.sm{padding:9px 12px;font-size:12.5px;width:auto}

  .field{margin-bottom:9px}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
  .inp{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;
     align-items:center;gap:8px;font-size:13.5px;color:var(--text);width:100%;font-family:inherit}
  .inp svg{color:var(--muted);flex:0 0 auto}
  .inp input{border:none;outline:none;flex:1;font-size:13.5px;font-family:inherit;color:var(--text);background:transparent}
  .inp input::placeholder{color:var(--muted-2)}
  .inp.ph{color:var(--muted-2)}
  textarea.ta{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-family:inherit;font-size:13px;color:var(--text);resize:none;min-height:62px;outline:none;background:#fff;line-height:1.45}
  textarea.ta:focus{border-color:var(--primary)}
  textarea.ta::placeholder{color:var(--muted-2)}
  .vinp{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-family:inherit;font-size:13px;width:96px;text-align:right;color:var(--text);outline:none}
  .vinp:focus{border-color:var(--primary)}

  .tabs{display:flex;background:#fff;border-radius:11px;padding:4px;gap:2px;border:1px solid var(--line);margin-bottom:13px}
  .tabs .t{flex:1;text-align:center;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted);
     border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
  .tabs .t.on{background:var(--primary);color:#fff}
  .tabs.pill .t.on{background:var(--blue-bg);color:var(--primary)}

  .listitem{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .listitem:last-child{border-bottom:none}

  .banner{border-radius:12px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
  .banner.urgent{background:var(--urgent-bg);border:1px solid #F3D19B}
  .banner.info{background:var(--blue-bg);border:1px solid #BBD6F2}
  .banner .ic{flex:0 0 auto;margin-top:1px}
  .banner.urgent .ic{color:var(--urgent)}.banner.info .ic{color:var(--primary)}
  .banner h4{font-size:12.5px;font-weight:700}.banner.urgent h4{color:#9A5B04}.banner.info h4{color:var(--primary-d)}
  .banner p{font-size:11.5px;margin-top:2px;line-height:1.45}.banner.urgent p{color:#A66A1C}.banner.info p{color:#2A6EA6}

  .bottomnav{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  .bottomnav .n{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;
     font-weight:600;color:var(--muted-2);cursor:pointer;position:relative;padding-top:2px}
  .bottomnav .n.on{color:var(--primary)}
  .bottomnav .n:active{opacity:.6}
  .bottomnav .n .nbadge{position:absolute;top:-2px;left:50%;margin-left:5px;background:var(--danger);
     color:#fff;font-size:8.5px;font-weight:700;min-width:15px;height:15px;border-radius:9px;
     display:flex;align-items:center;justify-content:center;padding:0 3px}

  .chat{display:flex;flex-direction:column;gap:9px;padding:6px 2px}
  .bubble{max-width:80%;padding:9px 12px;border-radius:15px;font-size:12.5px;line-height:1.45}
  .bubble .t{font-size:9.5px;margin-top:4px;display:block}
  .bubble.them{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
  .bubble.them .t{color:var(--muted-2)}
  .bubble.me{background:var(--primary);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .bubble.me .t{color:#CFE6F7}
  .daychip{align-self:center;background:#E7EAF0;color:var(--muted);font-size:10px;font-weight:600;padding:3px 12px;border-radius:12px;margin:2px 0}
  .composer{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);padding:9px 10px;display:flex;align-items:center;gap:8px}
  .composer .in{flex:1;background:var(--bg);border-radius:20px;padding:0 6px;display:flex;align-items:center}
  .composer .in input{border:none;outline:none;background:transparent;width:100%;padding:10px 8px;font-size:12.5px;font-family:inherit}
  .composer .snd{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer}
  .composer .snd:active{filter:brightness(.9)}

  .toggle{width:42px;height:24px;border-radius:13px;background:#CBD2DC;position:relative;flex:0 0 auto;cursor:pointer;transition:.2s}
  .toggle:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s}
  .toggle.on{background:var(--primary)}.toggle.on:after{left:20px}

  .vital{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 6px;text-align:center;flex:1}
  .vital .v{font-size:16px;font-weight:800}.vital .v .u{font-size:10px;font-weight:600}
  .vital .k{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px}
  .vital .d{font-size:9px;color:var(--muted-2);margin-top:3px}
  .divlink{color:var(--link);font-weight:600;cursor:pointer}

  /* login */
  .brandrow{display:flex;align-items:center;gap:11px}
  .logo{width:28px;height:28px;border-radius:50%;background:conic-gradient(from 210deg,#1583C5,#1A4C9C,#3AB0E0,#1583C5)}
  .logo.sm{width:22px;height:22px}.logo.lg{width:34px;height:34px}
  .brandtx{font-size:13px;letter-spacing:2px;color:var(--navy);font-weight:800}

  /* otp */
  .otpbox{flex:1;height:52px;border:1.5px solid var(--line);border-radius:11px;display:flex;
     align-items:center;justify-content:center;font-size:20px;font-weight:700;background:#fff}
  .otpbox.fill{border-color:var(--primary)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:auto;padding-top:14px}
  .key{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;
     font-size:20px;font-weight:600;cursor:pointer}
  .key:active{background:#eef1f5}
  .key.blank{background:transparent;border:none;cursor:default}

  /* call */
  .callscreen{flex:1;background:linear-gradient(160deg,#0C2E5E,#123A6B);display:flex;flex-direction:column;
     align-items:center;color:#fff;padding:36px 22px 30px}
  .mask{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);font-size:10.5px;
     padding:5px 12px;border-radius:20px;color:#CFE0F5}
  .callbtns{display:flex;gap:16px;margin-top:auto;align-items:center}
  .cbtn{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
  .cbtn:active{filter:brightness(.85)}
  .cbtn.end{background:var(--danger)}.cbtn.mute{background:rgba(255,255,255,.16)}
  .cbtn.mute.on{background:#fff;color:var(--navy)}.cbtn.spk{background:rgba(255,255,255,.16)}
  .cbtn.spk.on{background:#fff;color:var(--navy)}

  /* drawer */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;pointer-events:none;transition:.2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:absolute;top:0;left:0;bottom:0;width:78%;background:#fff;z-index:50;
     transform:translateX(-100%);transition:.24s;display:flex;flex-direction:column;box-shadow:6px 0 24px rgba(0,0,0,.2)}
  .drawer.open{transform:none}
  .drawer .dh{background:var(--navy);color:#fff;padding:26px 18px 18px}
  .drawer .di{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;font-weight:600;color:var(--text)}
  .drawer .di:active{background:#f3f5f8}
  .drawer .di svg{color:var(--muted)}

  /* toast */
  .toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);
     background:#111827;color:#fff;font-size:12.5px;font-weight:600;padding:11px 16px;border-radius:12px;
     z-index:80;opacity:0;transition:.25s;max-width:82%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* bottom-sheet popup */
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;z-index:55;
     transform:translateY(105%);transition:transform .30s cubic-bezier(.32,.72,0,1);max-height:90%;
     display:flex;flex-direction:column;box-shadow:0 -10px 34px rgba(0,0,0,.22)}
  .sheet.open{transform:none}
  .sheet .grab{width:40px;height:4px;border-radius:3px;background:#D5DAE2;margin:9px auto 0;flex:0 0 auto}
  .sheet .shead{display:flex;align-items:center;gap:10px;padding:10px 16px 11px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .sheet .shead .title{font-size:16px;font-weight:700;flex:1}
  .sheet .sbody{overflow-y:auto;padding:14px 16px 20px}
  .sheet .sbody::-webkit-scrollbar{width:0}

  .fadein{animation:fade .22s ease;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  @keyframes fade{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
  .chk{width:16px;height:16px;border:1.5px solid var(--primary);border-radius:5px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .chk.on{background:var(--primary)}
  .radio{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .radio.on{border-color:var(--primary);background:var(--primary);color:#fff}

  /* app launcher grid */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;position:relative;padding:2px}
  .tile:active{transform:scale(.94)}
  .tile .ico{width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 10px rgba(16,24,40,.12)}
  .tile .ico svg{width:22px;height:22px}
  .tile label{font-size:10.5px;font-weight:600;color:var(--text);text-align:center;line-height:1.2;cursor:pointer}
  .tile .tb{position:absolute;top:-5px;right:calc(50% - 26px);background:var(--danger);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;z-index:2;border:1.5px solid #fff}
  .hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin:0 -13px;padding-left:13px;padding-right:13px}
  .hscroll::-webkit-scrollbar{height:0}
  .pcard{flex:0 0 auto;width:128px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;cursor:pointer}
  .pcard:active{background:#fafbfc}
  /* edit / reorder mode */
  .tile.edit{animation:jiggle .28s infinite ease-in-out;touch-action:none}
  @keyframes jiggle{0%,100%{transform:rotate(-1.7deg)}50%{transform:rotate(1.7deg)}}
  .tile.dragging{animation:none!important;transition:none}
  .tile.hide{opacity:.34}
  .tile .rm{position:absolute;top:-6px;left:calc(50% - 27px);width:19px;height:19px;border-radius:50%;
     background:#111827;color:#fff;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;
     z-index:5;border:1.5px solid #fff}
  .tile.hide .rm{background:var(--green)}
  /* sticky bottom nav + patient list */
  .bottomnav{box-shadow:0 -2px 10px rgba(16,24,40,.06);position:relative;z-index:20}
  .mic svg{width:13px;height:13px}
  .vital.tap:active{background:#f7f9fb}
  /* month calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-wd{text-align:center;font-size:10px;font-weight:700;color:var(--muted-2);padding:5px 0}
  .cal-cell{height:42px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;
     color:var(--text);border-radius:11px;position:relative;cursor:pointer}
  .cal-cell.empty{visibility:hidden;cursor:default}
  .cal-cell.sel{background:var(--primary);color:#fff}
  .cal-cell.tap:active{background:#eef1f5}.cal-cell.sel.tap:active{background:var(--primary-d)}
  .cal-dot{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--urgent)}
  .cal-cell.sel .cal-dot{background:#fff}
  .cal-dots{position:absolute;bottom:5px;left:0;right:0;display:flex;gap:3px;justify-content:center}
  .cd{width:4px;height:4px;border-radius:50%}
  /* day timeline */
  .tl-row{display:flex;gap:10px;align-items:stretch;min-height:40px}
  .tl-time{width:42px;flex:0 0 auto;font-size:11px;color:var(--muted-2);padding-top:9px;text-align:right}
  .tl-body{flex:1;padding:5px 0;border-top:1px solid var(--line)}
  .tl-row:first-child .tl-body{border-top:none}
  .tl-appt{border-radius:10px;padding:9px 11px;cursor:pointer}
  .tl-appt:active{filter:brightness(.98)}
  .tl-blocked{border-radius:8px;padding:11px;background:repeating-linear-gradient(45deg,#EAECEF,#EAECEF 6px,#F5F6F8 6px,#F5F6F8 12px);color:var(--muted-2);font-size:11px;font-weight:600;text-align:center}
  .tl-empty{height:28px}
  .tl-nowrow{display:flex;align-items:center;margin:1px 0 1px 42px}
  .tl-nowdot{width:9px;height:9px;border-radius:50%;background:var(--danger);flex:0 0 auto}
  .tl-nowline{flex:1;height:2px;background:var(--danger)}
  .segbtn{display:flex;gap:2px;background:#EEF0F3;border-radius:9px;padding:3px}
  .segbtn .s{padding:5px 9px;border-radius:7px;color:var(--muted);cursor:pointer;display:flex}
  .segbtn .s.on{background:#fff;color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.08)}
</style>
</head>
<body>
<div class="stage">
  <div class="device">
    <div class="notch"></div>
    <div class="screen">
      <div id="app"></div>

      <div class="drawer" id="drawer"></div>

</div>

function patientsFiltered(){
 const q=(state.ui.patientSearch||'').toLowerCase();
 const f=state.ui.patFilter||'all';
 // search by name, email or phone (EHR-consistent). Digits-only match for phone.
 const qd=q.replace(/\D/g,'');
 let list=PATIENTS.filter(p=>povHas(p.owner)&&(f==='all'||p.status.toLowerCase()===f)&&(!q||p.name.toLowerCase().includes(q)||(p.email||'').toLowerCase().includes(q)||p.pid.toLowerCase().includes(q)||(qd&&p.phone.replace(/\D/g,'').includes(qd))));
 const sort=state.ui.patSort||'name';
 if(sort==='name')list=list.slice().sort((a,b)=>a.name.localeCompare(b.name));
 else if(sort==='recent')list=list.slice().sort((a,b)=>new Date(b.last)-new Date(a.last));
 else if(sort==='status')list=list.slice().sort((a,b)=>a.status.localeCompare(b.status)||a.name.localeCompare(b.name));
 return list;
}
/* potential duplicates = >1 patient sharing name + DOB within the current result set */
function dupKeys(list){const m={};list.forEach(p=>{const k=p.name.toLowerCase()+'|'+p.dob;m[k]=(m[k]||0)+1;});return new Set(Object.keys(m).filter(k=>m[k]>1));}
/* duplicate flag only applies while searching BY NAME (not email/phone) — matches the EHR suggestion list */
function isNameSearch(q){return !!q && !/[@\d]/.test(q);}

 const dups=nameSearch?dupKeys(list):new Set();
 return list.map(p=>{const isDup=dups.has(p.name.toLowerCase()+'|'+p.dob);
  return `<div class="card tap" data-act="openPatient" data-id="${p.id}" data-src="list" ${isDup?'style="border-color:#F3D19B"':''}>

 return `<div class="bottomnav" style="box-shadow:0 -2px 10px rgba(16,24,40,.06)">`+items.map(([id,label,ic])=>`<div class="n ${active===id?'on':''}" data-act="pmenu" data-id="${id}">${IC[ic]}<span>${label}</span></div>`).join('')+`</div>`;

/* floating action button — compact, bottom-right, above the footer */
function fab(o){return `<div class="fab" data-act="${o.act}" ${o.to?`data-to="${o.to}"`:''} ${o.id?`data-id="${o.id}"`:''} ${o.msg?`data-msg="${o.msg}"`:(o.act==='toast'?'data-msg="New thread"':'')}>${o.icon}${o.label?`<span>${o.label}</span>`:''}</div>`;}
/* POV switch — simple top-right avatar icons (Me + covered providers), tap to toggle which panel you view. Max 4 icons. */
function povSwitch(){
 const act=povActive();
 const ids=['me',...coveringList()].slice(0,4); // cap at 4 icons (me + up to 3 covered)
 const chip=(id)=>{const n=actionCount(id);const on=act===id;const self=id==='me';
   return `<span class="pov ${on?'on':''} ${self?'self':''}" data-act="setpov" data-p="${id}" title="${POV[id].name}${self?' (You)':''}">${POV[id].ini}${self?`<i class="selfdot">YOU</i>`:''}${n?`<i class="pvb">${n}</i>`:''}</span>`;};
 return `<span class="povswitch">${ids.map(chip).join('')}</span>`;
}
const tabs=(key,opts,pill)=>`<div class="tabs ${pill?'pill':''}">`+opts.map(o=>
   `<div class="t ${tab(key,opts[0].v)===o.v?'on':''}" data-act="settab" data-key="${key}" data-v="${o.v}">${o.label}${o.badge?` <span class="badge b-danger" style="padding:1px 6px">${o.badge}</span>`:''}</div>`).join('')+`</div>`;

function msgListHTML(){

 return ids.map(threadCardHTML).join('');

/* ============================ EVENTS ============================ */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'); if(!el)return;
 const a=el.dataset.act;
 switch(a){
  case 'go': go(el.dataset.to); break;
  case 'tabnav': tabnav(el.dataset.to); break;
  case 'back': back(); break;
  case 'openDrawer': openDrawer(); break;
  case 'closeDrawer': closeDrawer(); break;
  case 'logout': state.screen='login';state.stack=[];state.otp='';closeDrawer();render(); break;
  case 'toast': toast(el.dataset.msg); break;
  case 'noop': break;
  case 'settab': state.ui[el.dataset.key]=el.dataset.v; render(); break;
  case 'toggleSec': { const k=el.dataset.key; state.ui[k]=!state.ui[k]; render(); break; }
  case 'chipRemove': { const k=el.dataset.list; const i=+el.dataset.i; const arr=state.ui[k]; if(arr)arr.splice(i,1); render(); break; }
  case 'chipClear': { state.ui[el.dataset.list]=[]; render(); toast('Cleared'); break; }
  case 'chipAdd': { const k=el.dataset.list; const pool=CHIP_ADD_POOL[k]||[]; const arr=state.ui[k]||(state.ui[k]=[]); const next=pool[arr.length%Math.max(pool.length,1)]; if(next)arr.push(next); render(); toast('Added'); break; }
  /* pull the patient's charted entries into the note, skipping anything already documented here */
  case 'openAdd': { const d=el.dataset; openAddSheet(d.form,d.list?{list:d.list}:{chart:d.chart}); break; }
  case 'addSeg': { readAddForm(); const a=state.addForm; if(a){a.vals[ADD_FORMS[a.form].seg.k]=el.dataset.v;a.err='';renderAddSheet();} break; }
  case 'addSave': { readAddForm(); const a=state.addForm; if(!a)break; const f=ADD_FORMS[a.form];
    const nm=(a.vals.name||'').trim();
    if(!nm){a.err='Enter a '+f.fields[0].label.toLowerCase()+' to continue';renderAddSheet();break;}
    const detail=f.seg?(a.vals[f.seg.k]||f.seg.def):(a.vals.detail||'').trim();
    const dup=arr=>arr.some(c=>String(c[0]).trim().toLowerCase()===nm.toLowerCase());
    if(a.dest.list){const arr=state.ui[a.dest.list]||(state.ui[a.dest.list]=[]);
      if(dup(arr)){a.err=nm+' is already documented in this section';renderAddSheet();break;}
      arr.push([nm,detail]);}
    else{const cs=CHART_CLINICAL[a.dest.chart]; if(!cs)break;
      if(dup(cs.items)){a.err=nm+' is already in the chart';renderAddSheet();break;}
      cs.items.push([nm,detail]);}
    state.addForm=null;closeSheet();render();toast(nm+' added'); break; }
  case 'chipImport': { const k=el.dataset.list; const src=CHART_CLINICAL[CHART_IMPORT_KEY[k]]; if(!src){toast('Nothing to import');break;}
    const arr=state.ui[k]||(state.ui[k]=[]); const have=arr.map(c=>String(c[0]).toLowerCase());
    const added=src.items.filter(([nm])=>!have.includes(String(nm).toLowerCase()));
    added.forEach(c=>arr.push(c.slice())); render();
    toast(added.length?`Imported ${added.length} from chart`:'Already up to date with chart'); break; }
  case 'otpkey': if(state.otp.length<6){state.otp+=el.dataset.k;render();} break;
  case 'otpdel': state.otp=state.otp.slice(0,-1); render(); break;
  case 'verify': if(state.otp.length===6){tabnav('home');toast('Verified — biometric unlock enabled for 90 days');}else{toast('Enter all 6 digits');} break;
  case 'biounlock': tabnav('home'); toast('Unlocked with biometrics'); break;
  case 'lockapp': state.stack=[]; state.screen='unlock'; closeDrawer(); render(); break;
  case 'setpov': { state.pov=el.dataset.p; state.ui.patientSearch=''; render(); if(state.pov!=='me')toast('Viewing '+POV[state.pov].name+"'s panel"); break; }
  case 'addCovering': { const p=el.dataset.p; if(!state.covering.includes(p))state.covering.push(p); render(); toast('Now covering '+POV[p].name); break; }
  case 'removeCovering': { const p=el.dataset.p; state.covering=state.covering.filter(k=>k!==p); if(state.pov===p)state.pov='me'; render(); toast('Stopped covering '+POV[p].name); break; }
  case 'urgent': state.ui.msgFilter='open'; state.msgSearch=''; tabnav('messages'); break;
  case 'editgrid': state.edit=!state.edit; render(); break;
  case 'resetgrid': state.tileOrder=DEFAULT_ORDER.slice(); state.tileHidden=new Set(); saveOrder(); saveHidden(); render(); toast('Layout reset'); break;
  case 'toggletile': { const k=el.dataset.key; if(state.tileHidden.has(k))state.tileHidden.delete(k); else state.tileHidden.add(k); saveHidden(); renderGrid(); break; }
  case 'installapp': installApp(); break;
  case 'openChat': { const id=ensureThread(el.dataset.id); state.activeThread=id; if(THREADS[id].unread)THREADS[id].unread=false; go('chat'); break; }
  case 'openPatient': { const id=el.dataset.id; ensureThread(id); state.activePatient=id; state.activeThread=id; state.chartSource=el.dataset.src||'list'; state.ui.pdTab=(state.chartSource==='message'?'overview':'overview'); state.ui.labtab='labs'; state.ui.pdApptTab='upcoming'; state.ui.vnTab='signed'; go('patientDetail'); break; }
  case 'patientChat': { const id=el.dataset.id; state.activePatient=id; go('patientThreads'); break; }
  case 'pmenu': { const id=el.dataset.id; const pid=state.activeThread; if(PATIENTS.find(p=>p.id===pid))state.activePatient=pid; if(id==='chat')go('patientThreads'); else if(id==='rx')go('escribe'); else if(id==='appts'){state.chartSource='message';state.ui.pdTab='appts';go('patientDetail');} else if(id==='chart'){state.chartSource='message';state.ui.pdTab='clinical';go('patientDetail');} else if(id==='labs'){state.chartSource='message';state.ui.pdTab='labs';go('patientDetail');} break; }
  case 'viewPdf': state.pdfName=el.dataset.name; go('pdfView'); break;
  case 'openVisitNote': { const n=VISIT_NOTES.find(x=>x.id===el.dataset.id); if(n){state.activeVisitNote=n;state.activePatient=n.patientId;} state.ui.vnAmendOpen=false; state.ui.vnAmendDraft=''; resetVnEditChips(); go(n&&n.status==='Unsigned'?'visitNoteEdit':'visitNoteDetail'); break; }
  case 'saveDraftNote': { const n=VISIT_NOTES.find(x=>x.id===el.dataset.id); if(n)readVnEditForm(n); render(); toast('Draft saved'); break; }
  case 'signDraftNote': { const n=VISIT_NOTES.find(x=>x.id===el.dataset.id); if(n){readVnEditForm(n);n.status='Signed';n.signedBy='Dr. Jane Doe';n.signedDate='Just now';} go('visitNoteDetail'); toast('Visit note signed & completed'); break; }
  case 'toggleAmend': state.ui.vnAmendOpen=!state.ui.vnAmendOpen; render(); break;
  case 'cancelAmend': state.ui.vnAmendOpen=false; render(); break;
  case 'saveAmend': { const ta=document.getElementById('amendTa'); if(!ta)return; const v=ta.value.trim(); if(!v){toast('Enter amendment text');return;} const n=VISIT_NOTES.find(x=>x.id===el.dataset.id); if(n){n.addenda=n.addenda||[];n.addenda.push({author:'Dr. Jane Doe',date:'Just now',text:v});} state.ui.vnAmendOpen=false; render(); toast('Amendment added'); break; }
  case 'toggleTask': { const x=TASKS.find(t=>t.id===el.dataset.id); if(x)x.done=!x.done; render(); break; }
  case 'resolveThread': { const t=THREADS[el.dataset.id]; if(t)t.resolved=!t.resolved; render(); toast(t&&t.resolved?'Conversation resolved':'Conversation reopened'); break; }
  case 'openTask': { state.activeTask=el.dataset.id; go('taskDetail'); break; }
  case 'resolveTask': { const x=TASKS.find(t=>t.id===el.dataset.id); if(x){x.done=!x.done;x.status=x.done?'Completed':'Open';} render(); toast(x&&x.done?'Task resolved':'Task reopened'); break; }
  case 'taskSend': { const inp=document.getElementById('taskInput'); if(!inp)return; const v=inp.value.trim(); if(!v)return; const x=TASKS.find(t=>t.id===state.activeTask); if(x){x.conv=x.conv||[];x.conv.push({f:'me',t:v,ts:'now ✓'});} render(); break; }
  case 'sendTask': back(); toast('Task saved'); break;
  case 'addDx': { const c=document.getElementById('vnDx'); if(c){const codes=[['E11.9','Type 2 Diabetes'],['I10','Essential Hypertension'],['J06.9','Acute URI'],['M54.5','Low back pain']]; const pick=codes[c.querySelectorAll('.dxchip').length%codes.length]; const s=document.createElement('span'); s.className='badge b-gray dxchip'; s.innerHTML=pick[0]+' — '+pick[1]; c.insertBefore(s,c.querySelector('[data-act="addDx"]'));} toast('Diagnosis added'); break; }
  case 'addCpt': { const c=document.getElementById('vnCpt'); if(c){const codes=[['99214','Office visit, established, moderate'],['99396','Preventive visit, 40-64 yrs'],['90471','Immunization administration'],['80053','Comprehensive metabolic panel']]; const pick=codes[c.querySelectorAll('.cptchip').length%codes.length]; const s=document.createElement('span'); s.className='badge b-gray cptchip'; s.innerHTML=pick[0]+' — '+pick[1]; c.insertBefore(s,c.querySelector('[data-act="addCpt"]'));} toast('CPT code added'); break; }
  case 'addVisitNote': { const pid=state.activePatient; const n={id:'vn_new_'+Date.now(),patientId:pid,date:'Today',provider:'Dr. Jane Doe',location:state.location,apptType:'Office Visit',mode:'In-person',reason:'',subjective:'',objective:'',allergies:[['Penicillin','Severe'],['Sulfa Drugs','Moderate'],['Peanuts','Mild']],intol:[['Metformin','GI upset']],meds:['Pantocid','Metoprolol 50mg'],assessment:'',dx:[],plan:'',cpt:[],exam:null,vitals:{weight:'',height:'',temp:'',bp:'',hr:'',rr:'',spo2:'',bmi:'',pain:'',headCirc:''},status:'Unsigned',signedBy:'',signedDate:'',addenda:[]}; VISIT_NOTES.push(n); state.activeVisitNote=n; state.ui.vnAmendOpen=false; state.ui.vnAmendDraft=''; resetVnEditChips(); go('visitNoteEdit'); toast('New visit note started'); break; }
  case 'addOrder': { const o=placeOrder(el.dataset.o); if(!o)break; render(); toast(o.type+' added — '+o.name); break; }
  case 'openOrder': { const o=ORDERS.find(v=>v.id===el.dataset.id); if(o){state.activeOrder=o;go('orderDetail');} break; }
  case 'focusSearch': { const i=document.getElementById('patSearch'); if(i)i.focus(); break; }
  case 'patsort': { const o=['name','recent','status']; state.ui.patSort=o[(o.indexOf(state.ui.patSort||'name')+1)%o.length]; render(); toast('Sorted by '+state.ui.patSort); break; }
  case 'annotateReport': toast('Annotation saved to report — no PDF stored on device'); break;
  case 'shareReport': { const pid=state.activePatient; ensureThread(pid); const th=THREADS[pid]; const note=state.pdfName||'Report'; th.msgs.push({f:'me',t:`📎 ${note} — shared as a secure view-only link (not downloaded). My note: please review, let's discuss your results.`,ts:'now ✓'}); th.preview='Shared: '+note; state.activeThread=pid; go('chat'); toast('Report shared to chat — view-only, no download'); break; }
  case 'attach': state.attachOpen=!state.attachOpen; render(); break;
  case 'attachReport': state.attachOpen=false; render(); toast('Annotated report attached — secure link, not saved to device'); break;
  case 'send': state.attachOpen=false; sendMsg(); break;
  case 'pickCallerId': state.callerId=el.dataset.k; render(); toast('Caller ID: '+CALLERIDS[state.callerId].label); break;
  case 'voicecall': state.callProvider='Twilio'; go('voicecall'); break;
  case 'gotocall': state.callProvider='GoTo'; go('voicecall'); break;
  case 'togglemute': state.call.muted=!state.call.muted; document.querySelector('.cbtn.mute').classList.toggle('on',state.call.muted); toast(state.call.muted?'Muted':'Unmuted'); break;
  case 'togglespk': state.call.spk=!state.call.spk; document.querySelector('.cbtn.spk').classList.toggle('on',state.call.spk); toast(state.call.spk?'Speaker on':'Speaker off'); break;
  case 'endcall': stopCall(); back(); toast('Call ended'); break;
  case 'localtoggle': el.classList.toggle('on'); break;
  case 'rxsent': toast('Prescription signed & sent to pharmacy'); back(); break;
  case 'openAppt': { state.activeAppt=APPTS.find(a=>a.id===el.dataset.id); const ap=state.activeAppt; if(ap&&ap.patientId){ensureThread(ap.patientId);state.activePatient=ap.patientId;} go('apptDetail'); break; }
  case 'pickDay': state.schedDay=+el.dataset.d; render(); break;
  case 'apptPrevDay': state.schedDay=Math.max(1,state.schedDay-1); render(); break;
  case 'apptNextDay': state.schedDay=Math.min(31,state.schedDay+1); render(); break;
  case 'startAppt': { const a=state.activeAppt; if(a){a.status='In Progress';a.cls='urgent';if(a.patientId){ensureThread(a.patientId);state.activePatient=a.patientId;}} go('visitNote'); toast('Appointment started — visit note opened'); break; }
  case 'joinVideoAppt': { const a=state.activeAppt; if(a){a.status='In Progress';a.cls='urgent';if(a.patientId){state.activeThread=ensureThread(a.patientId);state.activePatient=a.patientId;}} go('videocall'); toast('Joining video visit…'); break; }
  case 'continueAppt': { const a=state.activeAppt; if(a&&a.patientId){ensureThread(a.patientId);state.activePatient=a.patientId;} go('visitNote'); break; }
  case 'signVisit': { const a=state.activeAppt; if(a){a.status='Checked Out';a.cls='green';} back(); toast('Visit signed & completed'); break; }
  case 'completeAppt': { const a=state.activeAppt; if(a){a.status='Checked Out';a.cls='green';} back(); toast('Visit completed'); break; }
  case 'cancelAppt': back(); toast('Appointment cancelled'); break;
  case 'rescheduleAppt': { const a=state.activeAppt; if(a&&a.patientId)state.activePatient=a.patientId; state.apptSheetMode='reschedule'; state.apptSlot=null; state.apptMode=a&&a.mode==='Video'?'video':a&&a.mode==='Telephone'?'phone':'inperson'; openApptSheet(); break; }
  case 'editAppt': { const a=state.activeAppt; if(a&&a.patientId)state.activePatient=a.patientId; state.apptSheetMode='edit'; state.apptSlot=null; state.apptMode=a&&a.mode==='Video'?'video':a&&a.mode==='Telephone'?'phone':'inperson'; openApptSheet(); break; }
  case 'newApptSheet': state.apptSheetMode='new'; state.apptSlot=null; state.apptMode='inperson'; state.apptType='patient'; state.apptRepeat=false; state.apptDependent=false; openApptSheet(); break;
  case 'locSheet': openLocSheet(); break;
  case 'newThread': openThreadSheet(); break;
  case 'sendThread': closeSheet(); toast('Thread sent'); break;
  case 'setLocation': state.location=el.dataset.l; closeSheet(); render(); toast('Location switched to '+el.dataset.l); break;
  case 'apptType': state.apptType=el.dataset.v; if(state.sheetOpen)renderApptSheet(); break;
  case 'apptToggle': { const k=el.dataset.k; if(k==='repeat')state.apptRepeat=!state.apptRepeat; else state.apptDependent=!state.apptDependent; if(state.sheetOpen)renderApptSheet(); break; }
  case 'closeSheet': closeSheet(); break;
  case 'openOptions': openOptionSheet(el.dataset.key); break;
  case 'pickOption': { state.ui[el.dataset.key]=el.dataset.v; closeSheet(); render(); break; }
  case 'apptmode': state.apptMode=el.dataset.v; state.sheetOpen?renderApptSheet():render(); break;
  case 'apptslot': state.apptSlot=el.dataset.v; state.sheetOpen?renderApptSheet():render(); break;
  case 'confirmappt': { const mode=state.apptSheetMode; const resched=mode==='reschedule'; if(resched&&!state.apptSlot){toast('Select a time slot');break;} const wasSheet=state.sheetOpen; state.apptSlot=null; state.apptMode='inperson'; if(wasSheet){closeSheet();}else{back();} toast(mode==='edit'?'Appointment updated':resched?'Appointment rescheduled':'Appointment scheduled'); break; }
  case 'notif': { const k=el.dataset.k; state.notif[k]=!state.notif[k]; render(); toast(k==='after'?(state.notif.after?'Urgent message alerts on':'Urgent message alerts off'):''); break; }
  case 'coverpick': state.coverPick=el.dataset.id; render(); break;
  case 'sendcover':
    if(!state.coverPick){toast('Select a provider');break;}
    state.coverage=state.coverPick;
    state.coverWindow={fromDate:'07/22/2026',fromTime:'06:00 PM',toDate:'07/24/2026',toTime:'08:00 AM'};
    back(); toast('Coverage request sent — awaiting accept'); break;
  case 'endcoverage': state.coverage=null; render(); toast('Coverage ended — calls & messages back to you'); break;
  case 'acceptcover': { if(!state.covering.includes('flores'))state.covering.push('flores'); state.pov='flores'; state.screen='home';state.stack=[]; render(); toast('Coverage accepted — now covering Dr. Flores'); break; }
  case 'denycover': back(); toast('Request denied — requester notified'); break;
 }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='chatInput'){e.preventDefault();sendMsg();} if(e.key==='Enter'&&e.target.id==='taskInput'){e.preventDefault();const inp=e.target;const v=inp.value.trim();if(v){const x=TASKS.find(t=>t.id===state.activeTask);if(x){x.conv=x.conv||[];x.conv.push({f:'me',t:v,ts:'now ✓'});}render();}} });
document.addEventListener('input',e=>{ if(e.target.id==='patSearch'){ state.ui.patientSearch=e.target.value; renderPatientList(); } if(e.target.id==='homeSearch'){ state.homeSearch=e.target.value; renderHomeSearch(); } if(e.target.id==='msgSearch'){ state.msgSearch=e.target.value; const c=document.getElementById('msgList'); if(c)c.innerHTML=msgListHTML(); } if(e.target.id==='taskNote'){ const b=document.getElementById('taskSaveBtn'); if(b){ const on=e.target.value.trim().length>0; b.style.background=on?'var(--primary)':'#EDEFF2'; b.style.color=on?'#fff':'#9AA3AF'; b.style.pointerEvents=on?'auto':'none'; } } });
function sendMsg(){const inp=document.getElementById('chatInput');if(!inp)return;const v=inp.value.trim();if(!v)return;
 const t=THREADS[state.activeThread];t.msgs.push({f:'me',t:v,ts:'now ✓'});t.preview=v;render();
 setTimeout(()=>{t.msgs.push({f:'them',t:'Thank you doctor, understood.',ts:'now'});render();},1200);}

/* ---- launcher grid: partial re-render + drag reorder ---- */
function renderGrid(){const g=document.getElementById('tileGrid');if(g)g.innerHTML=tilesHTML();}
let dg=null;
document.addEventListener('pointerdown',e=>{
 if(state.screen!=='home'||!state.edit)return;
 if(e.target.closest('.rm'))return;                       // tapping × should not start a drag
 const tile=e.target.closest('.tile'); if(!tile||!tile.dataset.key||state.tileHidden.has(tile.dataset.key))return;
 dg={key:tile.dataset.key,x:e.clientX,y:e.clientY,el:tile};
 tile.classList.add('dragging');
});
document.addEventListener('pointermove',e=>{
 if(!dg)return; e.preventDefault();
 const el=dg.el;
 el.style.transform=`translate(${e.clientX-dg.x}px,${e.clientY-dg.y}px) scale(1.12)`;
 el.style.zIndex='60'; el.style.opacity='.92';
 el.style.pointerEvents='none';
 const pt=document.elementFromPoint(e.clientX,e.clientY);
 el.style.pointerEvents='';
 const over=pt?pt.closest('.tile'):null;
 if(over&&over.dataset.key&&over.dataset.key!==dg.key&&!state.tileHidden.has(over.dataset.key)){
   const from=state.tileOrder.indexOf(dg.key),to=state.tileOrder.indexOf(over.dataset.key);
   if(from>-1&&to>-1){
     state.tileOrder.splice(to,0,state.tileOrder.splice(from,1)[0]); saveOrder(); renderGrid();
     dg.el=document.querySelector(`#tileGrid .tile[data-key="${dg.key}"]`);
     if(dg.el){dg.el.classList.add('dragging');dg.x=e.clientX;dg.y=e.clientY;
       dg.el.style.transform='translate(0,0) scale(1.12)';dg.el.style.zIndex='60';dg.el.style.opacity='.92';}
   }
 }
},{passive:false});
function endDrag(){if(!dg)return;if(dg.el){dg.el.classList.remove('dragging');dg.el.style.transform='';dg.el.style.zIndex='';dg.el.style.opacity='';dg.el.style.pointerEvents='';}dg=null;saveOrder();}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* ---- PWA: install prompt + service worker ---- */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
async function installApp(){closeDrawer();
 if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;toast(r.outcome==='accepted'?'Installing app…':'Install dismissed');}
 else{toast('Serve via localhost, then browser menu → Install / Add to Home Screen');}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}

render();
</script>
